<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (very important for SEO) -->
    <title>Md Akther Hosen | Full-Stack Web Developer & React Expert</title>

    <!-- Primary SEO Meta -->
    <meta
      name="description"
      content="Md Akther Hosen is a professional full-stack web developer specializing in React, TypeScript, and Node.js. Crafting high-performance, accessible, and user-centric web applications." />
    <meta
      name="keywords"
      content="Md Akther Hosen, Full-Stack Developer, React Developer, Node.js, TypeScript, Portfolio, Web Development" />
    <meta name="author" content="Md Akther Hosen" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://aktherhosen.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aktherhosen.com/" />
    <meta
      property="og:title"
      content="Md Akther Hosen | Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Full-stack web developer specializing in React, TypeScript, and Node.js. Building accessible, high-performance web experiences." />
    <meta property="og:image" content="https://aktherhosen.com/og-image.png" />
    <meta property="og:site_name" content="Md Akther Hosen" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aktherhosen.com/" />
    <meta
      property="twitter:title"
      content="Md Akther Hosen | Full-Stack Web Developer" />
    <meta
      property="twitter:description"
      content="React, TypeScript, and Node.js developer focused on scalable and accessible web apps." />
    <meta
      property="twitter:image"
      content="https://aktherhosen.com/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Md Akther Hosen",
        "url": "https://aktherhosen.com/",
        "jobTitle": "Full-Stack Web Developer",
        "sameAs": [
          "https://github.com/aktherhosen",
          "https://linkedin.com/in/aktherhosen",
          "https://twitter.com/aktherhosen"
        ],
        "description": "Full-stack web developer specializing in React, TypeScript, and Node.js."
      }
    </script>

    <!-- Theme Color (mobile browsers) -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
