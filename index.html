<!doctype html>
<html lang="en">
<head>
  <!-- Basic Meta -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title (very important for SEO) -->
  <title>Md Akther Hosen | Full-Stack Web Developer (React, Node.js)</title>

  <!-- Primary SEO Meta -->
  <meta name="description"
    content="Md Akther Hosen is a full-stack web developer specializing in React, TypeScript, and Node.js. Building fast, accessible, and human-centered web applications." />
  <meta name="author" content="Md Akther Hosen" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://aktherhosen.com/" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:title" content="Md Akther Hosen | Full-Stack Web Developer" />
  <meta property="og:description"
    content="Full-stack web developer specializing in React, TypeScript, and Node.js. Building accessible, high-performance web experiences." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aktherhosen.com/" />
  <meta property="og:image" content="https://aktherhosen.com/og-image.png" />
  <meta property="og:site_name" content="Md Akther Hosen" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Md Akther Hosen | Full-Stack Web Developer" />

    content="React, TypeScript, and Node.js developer focused on scalable and accessible web apps." />
  <meta name="twitter:image" content="https://aktherhosen.com/og-image.png" />

  <!-- Theme Color (mobile browsers) -->
  <meta name="theme-color" content="#0f172a" />

  <!-- Optional: Performance hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
